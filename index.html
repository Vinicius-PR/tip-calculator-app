<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <script defer src="./main.js"></script>
  <title>Frontend Mentor | Tip calculator app</title>
</head>
<body>

  <h1 class="sr-only">Splitter</h1>
  
  <div class="body-wrapper">
     <header>
      <img src="./images/logo.svg" alt="Logo">
    </header>

    <main class="main-container">

      <section class="inputs-container">
        <div class="form-group">
          <div class="label-group">
            <label for="bill" class="text-preset-5 text-color-grey-500">Bill</label>
            <span id="bill-error" class="text-preset-5 error-span-bill">Can’t be zero</span>
          </div>
          <div class="input-wrapper">
            <img src="./images/icon-dollar.svg" alt="" class="icon">
            <input class="bill-input text-preset-3" id="bill" name="bill" type="text" inputmode="decimal" placeholder="0.00" aria-errormessage="bill-error" aria-invalid="false">
          </div>
        </div>

        <div class="tip-container">
          <h2 class="text-preset-5 text-color-grey-500">Select Tip %</h2>
          <div class="tip-selector">
            <button class="percentag-btn text-preset-3" type="button" data-tip="5">5%</button>
            <button class="text-preset-3" type="button" data-tip="10">10%</button>
            <button class="text-preset-3" type="button" data-tip="15">15%</button>
            <button class="text-preset-3" type="button" data-tip="25">25%</button>
            <button class="text-preset-3" type="button" data-tip="50">50%</button>

            <input id="custom-percentage" class="custom-percentage text-preset-3" type="text" inputmode="decimal" placeholder="Custom">
          </div>
        </div>
        <div class="form-group">
          <div class="label-group">
            <label for="people" class="text-preset-5 text-color-grey-500">Number of People</label>
            <span id="number-people-error" class="text-preset-5 error-span-num">Can’t be zero</span>
          </div>
          <div class="input-wrapper">
            <img src="./images/icon-person.svg" alt="" class="icon">
            <input class="people-input text-preset-3" id="people" name="people" type="text" inputmode="numeric" placeholder="0" aria-errormessage="number-people-error" aria-invalid="false">
          </div>
        </div>

      </section>

      <section class="result-container">

        <div class="results">

          <div class="result-content">
            <div class="result-title">
              <h3 class="text-preset-5">Tip Amount</h3>
              <span class="text-preset-6">/ person</span>
            </div>
            <h2 class="result-tip text-preset-1">$0.00</h2>
          </div>

          <div class="result-content">
            <div class="result-title">
              <h3 class="text-preset-5">Total</h3>
              <span class="text-preset-6">/ person</span>
            </div>
            <h2 class="result-total-per-person text-preset-1">$0.00</h2>
          </div>

        </div>

        <button disabled class="reset-btn text-preset-4">RESET</button>
      </section>
    </main>
  </div>

</body>
</html>
